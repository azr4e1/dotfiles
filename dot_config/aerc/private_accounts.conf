[Unified]
source=notmuch://
# Explicit database paths in the notmuch source URL are no longer supported.
# The database is now discovered automatically via environment variables
query-map=/home/ld/.config/aerc/notmuch-queries
# maildir-store=/home/ld/.local/share/mail/
# the maildir-store option has been replaced by enable-maildir, default true.
# The maildir root is now always obtained from the notmuch database
folders=Inbox,Sent,Important,Newsletter,Bin,Drafts,Spam  # Only show these
outgoing=msmtp -a posteo
copy-to=Posteo/Sent
default=Inbox
folders-sort = Inbox,Sent,Important,Newsletter,Drafts,Bin,Spam
archive = Archive
from = Lorenzo Drumond <drumondlorenzo@posteo.net>
check-mail-cmd = mail-sync.sh
check-mail-timeout = 30s

[Posteo]
source   = maildir:///home/ld/.local/share/mail/Posteo
outgoing = msmtp -a posteo
default  = INBOX
folders-sort = INBOX,Sent,Archive,Drafts,Trash,Spam
from     = Lorenzo Drumond <drumondlorenzo@posteo.net>
copy-to  = Sent
archive = Important
check-mail-cmd = mail-sync.sh posteo
check-mail-timeout = 30s  # Or higher, e.g., 60s

[Gmail]
source   = maildir:///home/ld/.local/share/mail/GMAIL
outgoing = msmtp -a gmail
default  = INBOX
folders-sort = INBOX,Sent,Archive,Drafts,Trash,Spam
from     = Lorenzo Drumond <drumondlorenzo@gmail.com>
copy-to  = Sent
archive = Important
check-mail-cmd = mail-sync.sh gmail
check-mail-timeout = 30s  # Or higher, e.g., 60s

