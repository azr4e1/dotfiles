# aerc beans styleset
#
# This styleset uses the terminal defaults as its fallback.
# More information on how to configure the styleset can be found in
# the aerc-stylesets(7) manpage. Please read the manual before
# modifying or creating a styleset.
#

*.default=true

default.bg=#111111

title.reverse=true
header.bold=true
header.fg=#ebebd8

*error.bold=true
error.fg=#f44747
warning.fg=#ff9f00
success.fg=#ccff00

statusline*.default=true
statusline_error.fg=#f44747
statusline_default.fg=#dea407
statusline_default.bg=#111111

dirlist_recent.selected.fg=#292929
dirlist_unread.fg=#48c6ff
dirlist_unread.selected.fg=#48c6ff
dirlist_default.selected.bg=#292929
dirlist_default.selected.fg=#ebebd8

msglist_default.selected.fg=#292929
msglist_default.selected.bg=#ff9f00
msglist_unread.bold=true
msglist_unread.fg=#48c6ff
msglist_unread.selected.bg=#292929
msglist_read.selected.fg=#ebebd8
msglist_read.selected.bg=#292929
msglist_marked.fg=#ff9f00
msglist_marked.selected.fg=#ebebd8
msglist_marked.selected.bg=#292929
msglist_deleted.fg=#ff005b
msglist_result.fg=#ebebd8
msglist_result.selected.bg=#292929

msglist_deleted.selected.reverse=toggle

completion_pill.reverse=true

tab.reverse=true
border.reverse=true
tab.bg=#ff9f00
tab.fg=#292929
tab.selected.bg=#292929
tab.selected.fg=#ff9f00
border.fg=#292929

selector_focused.reverse=true
selector_chooser.bold=true
